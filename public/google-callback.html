<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <title>Google-koppling klar</title>
  <style>
    body { background: #02020e; color: #e0e0e0; font-family: -apple-system, sans-serif; padding: 40px 20px; text-align: center; }
    .box { max-width: 340px; margin: 60px auto; padding: 28px; background: #0c0c1e; border: 1px solid #00F0FF33; border-radius: 16px; }
    h1 { font-size: 18px; margin: 0 0 12px; background: linear-gradient(90deg, #00F0FF, #F2B8B4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p { font-size: 13px; color: #888; line-height: 1.7; }
  </style>
</head>
<body>
  <div class="box">
    <h1>✨ Google Calendar ansluten</h1>
    <p>Du kan stänga detta fönster nu.</p>
  </div>
  <script>
    // Skicka auth-koden tillbaka till huvudfönstret.
    // Google's consent-sida sätter COOP-headers som kan kapa window.opener,
    // så vi försöker BroadcastChannel först (fungerar över COOP), sedan
    // localStorage-event, och postMessage som sista fallback.
    const url = new URL(window.location.href);
    const payload = {
      type: "google-oauth-code",
      code: url.searchParams.get("code"),
      state: url.searchParams.get("state"),
      error: url.searchParams.get("error"),
    };

    try {
      const ch = new BroadcastChannel("google-oauth");
      ch.postMessage(payload);
      ch.close();
    } catch {}

    try {
      localStorage.setItem("google_oauth_result", JSON.stringify({ ...payload, ts: Date.now() }));
    } catch {}

    try {
      if (window.opener) {
        window.opener.postMessage(payload, window.location.origin);
      }
    } catch {}

    setTimeout(() => window.close(), 500);
  </script>
</body>
</html>
